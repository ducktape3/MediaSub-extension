<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediaSub Player</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div id="app">
        <div id="landing-state">
            <div class="landing-content">
                <h1>MediaSub Player</h1>
                <p>Drag & Drop files here or</p>
                <div class="file-inputs">
                    <label class="btn-primary">
                        <input type="file" id="media-input" accept="video/*,audio/*">
                        <span>Select Media File</span>
                    </label>
                </div>
                <div class="web-subs">
                    <p>Or add subtitles to a video on this web page:</p>
                    <label class="btn-secondary">
                        <input type="file" id="web-subtitle-input" accept=".srt,.vtt">
                        <span>Load Subtitles for Page Video</span>
                    </label>
                    <p id="web-status" class="web-status" role="status"></p>
                </div>
            </div>
        </div>

        <div id="player-state" class="hidden">
            <div id="player-container">
                <video id="main-video"></video>
                <div id="subtitle-overlay"></div>
                
                <div id="controls-overlay">
                    <div class="progress-container">
                        <input type="range" id="seek-bar" min="0" value="0" step="0.1">
                        <div class="time-display">
                            <span id="current-time">00:00</span> / <span id="duration">00:00</span>
                        </div>
                    </div>
                    
                    <div class="controls-row">
                        <div class="left-controls">
                            <button id="play-pause-btn" class="icon-btn" title="Play/Pause (Space)"></button>
                            <div class="volume-container">
                                <button id="mute-btn" class="icon-btn" title="Mute (M)"></button>
                                <input type="range" id="volume-bar" min="0" max="1" step="0.1" value="1">
                            </div>
                        </div>
                        
                        <div class="right-controls">
                            <label class="icon-btn" title="Load Subtitles (S)">
                                <input type="file" id="subtitle-input" accept=".srt,.vtt" class="hidden-input">
                                <span class="icon-placeholder" data-icon="subtitles"></span>
                            </label>
                            <button id="pip-btn" class="icon-btn" title="Picture-in-Picture (P)"></button>
                            <button id="fullscreen-btn" class="icon-btn" title="Fullscreen (F)"></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="popup.js"></script>
</body>
</html>
